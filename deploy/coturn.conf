# coturn (TURN/STUN) for the WebRTC stream stand -> backend (spec §3: TURN is part of the
# delivery). Mounted read-only at /etc/coturn/turnserver.conf by docker-compose.yml.
#
# Values that differ per site are passed on the command line from .env (docker-compose.yml):
#   --static-auth-secret=${TURN_SECRET}     shared secret, the SAME value as AIIRIS_TURN_SECRET
#   --external-ip=${TURN_EXTERNAL_IP}       address the stands reach this host at (public IP
#                                           in the cloud, LAN IP on-prem)
#   --realm=${TURN_REALM}
#   --listening-port / --min-port / --max-port from TURN_PORT, TURN_MIN_PORT, TURN_MAX_PORT
#
# Authentication: TURN REST API ("use-auth-secret"): the backend hands out time-limited
# credentials (username "<expiry>:<who>", password HMAC-SHA1(secret, username)) through
# GET /client-config and uses the same scheme for its own aiortc peer. No static user list.
#
# Ports to open in the firewall: TURN_PORT (default 3478) UDP+TCP and the relay range
# TURN_MIN_PORT..TURN_MAX_PORT (default 49160-49200) UDP. Each relayed stream uses 2 relay
# ports (one per peer allocation), so 40 ports cover ~20 simultaneous streams.

use-auth-secret
fingerprint
# no anonymous / static users
no-cli
no-multicast-peers
# TURN only for this service: refuse relaying to loopback and link-local/multicast space
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# the backend container sits in the docker network: allow relaying to private ranges
# (hospital LAN, docker bridge). Tighten with denied-peer-ip for your site if needed.
allowed-peer-ip=10.0.0.0-10.255.255.255
allowed-peer-ip=172.16.0.0-172.31.255.255
allowed-peer-ip=192.168.0.0-192.168.255.255
# a stream is ~2-8 Mbit/s; cap per session at 16 Mbit/s (bytes/s)
max-bps=2000000
stale-nonce=600
# logs to stdout (docker logs); no per-packet verbosity
log-file=stdout
simple-log
# TLS (turns:, port 5349) is optional: mount cert/key and uncomment
# cert=/etc/coturn/certs/tls.crt
# pkey=/etc/coturn/certs/tls.key
no-tls
no-dtls
