# Shared by the HTTP (8080) and HTTPS (8443) servers.
access_log /var/log/nginx/access.log aiiris;
root /usr/share/nginx/html;

# container healthcheck (does not depend on the backend)
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Backend REST + results WebSocket under /api (the stand page's default base).
# $aiiris_backend is set per server (templates). Docker's DNS + a variable upstream: nginx starts even while the backend is still loading.
location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$aiiris_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    # /stop waits for the drain; the results WebSocket lives as long as the session
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 1m;
}

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
